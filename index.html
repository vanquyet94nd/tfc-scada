    }

    {
    
     stroke: none;  /* Đổi màu viền */
     
    }
     .rotate {
      stroke: #1e10d6;
      transform-origin: center;
      transform-box: fill-box;
      animation: xoayQuanhTam 0.8s linear infinite;
    }

   
      .stop {
      stroke: #5c5b6e;
      transform-origin: center;
      transform-box: fill-box;
      animation: xoayQuanhTam 0s linear infinite;
    }

      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }

    function creat_chart(width,height,padding,xvalue,yvalue,text)
    {
    width=900;
    height=400;
    padding=20;
    const chartWidth = width - padding * 2;
    const chartHeight = height - (padding * 2.5);
    const maxVal = 200000;
    const barWidth = chartWidth / xvalue.length - (width/100);
    let svgContent = `<svg width="auto" height="auto" viewBox="0 0 ${width} ${height+10}"  version="1.1"  xmlns="http://www.w3.org/2000/svg">`;
    svgContent += `<line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" class="axis" />`;
    svgContent += `<line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" class="axis" />`;
    svgContent +=  "<text x=\""+(width/2)+ "\"y=\""+20+"\" font-size=\"20px\" font-weight=\"bold\" text-anchor=\"middle\">"+text+"</text>";
    xvalue.forEach((item, index) => {
        const barH = ((xvalue[index]) / maxVal) * (chartHeight/2);
        const x = padding + index * (chartWidth / xvalue.length) + 5;
        const y = height - padding - barH;

       
        svgContent += `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" class="bar" />`;
        
        // Nhãn tên (Trục X)
        svgContent += `<text x="${x + barWidth / 2}" y="${height - padding + 25}"  font-size="20px" text-anchor="middle">${yvalue[index]}</text>`;
        
        // Giá trị trên đầu cột
        svgContent += `<text x="${x + barWidth / 2}" y="${y - 3}" font-size="20px" transform="rotate(-90, ${x + barWidth / 2}, ${y - 5})" text-anchor="start">${(Number)(xvalue[index]).toLocaleString('en-US')}</text>`;
    });
    return svgContent+"</svg>";
    }
